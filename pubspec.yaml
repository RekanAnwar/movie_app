name: movie_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  # Core
  flutter:
    sdk: flutter

  # State management
  flutter_hooks: ^0.21.3+1
  flutter_riverpod: ^3.3.2
  hooks_riverpod: ^3.3.2
  riverpod: ^3.3.2

  # Networking and Logging
  dio: ^5.11.1
  talker: ^5.1.20
  talker_dio_logger: ^5.1.20

  # Storage & config
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5

  # UI & media
  cached_network_image_ce: ^4.10.1
  capsule_toast: ^1.1.1
  carousel_slider: ^5.1.2
  shimmer: ^3.0.0
  sliver_tools: ^0.2.12
  smooth_page_indicator: ^3.0.0

  # Utilities
  collection: ^1.19.1
  equatable: ^2.1.0
  extensions_plus: ^1.6.0
  intl: ^0.20.3

dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0

  # App branding
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic
