name: movie_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  equatable: ^2.1.0
  extensions_plus: ^1.6.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  hooks_riverpod: ^3.3.2
  riverpod: ^3.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/logos/

  fonts:
    - family: NimbusSans
      fonts:
        - asset: assets/fonts/NimbusSans-UltraLight.otf
          weight: 200
        - asset: assets/fonts/NimbusSans-Regular.otf
          weight: 400
        - asset: assets/fonts/NimbusSans-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/NimbusSans-Bold.otf
          weight: 700
        - asset: assets/fonts/NimbusSans-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/NimbusSans-Black.ttf
          weight: 900
